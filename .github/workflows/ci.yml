name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/WindowsPartitionManager.Core.Tests --no-build -c Release --logger "trx;LogFileName=unit.trx"

      # Integration tests need an elevated host with virtual disk support; the hosted runner is
      # elevated, so try them, but do not fail the build on infrastructure differences.
      - name: Integration tests (best effort)
        continue-on-error: true
        run: dotnet test tests/WindowsPartitionManager.Integration.Tests --no-build -c Release --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
